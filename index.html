<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KGU 베리어프리맵</title><link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet"><style>
:root{--blue:#174a72;--mint:#007c72;--bg:#f7fafc}*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;color:#1c3040;background:var(--bg)}button,select{font:inherit}button{cursor:pointer}#map{position:fixed;inset:0;background:#e3ebe8}.top{position:fixed;z-index:5;left:12px;top:12px;right:12px;display:flex;gap:8px;align-items:center;pointer-events:none}.brand,.sound{pointer-events:auto;background:white;border:0;border-radius:16px;box-shadow:0 3px 18px #183a5030;padding:12px 14px}.brand{flex:1;max-width:420px}.brand b{font-size:17px;color:var(--blue)}.brand small{display:block;color:#667789;font-size:11px;margin-top:3px}.sound{font-size:14px;white-space:nowrap}.float{position:fixed;z-index:5;bottom:20px;left:50%;transform:translateX(-50%);width:min(94%,520px);background:white;border-radius:20px;box-shadow:0 6px 32px #183a5040;padding:14px}.float>button{width:100%;border:0;border-radius:12px;background:var(--blue);color:white;font-weight:700;padding:13px}.panel{display:none;position:fixed;z-index:6;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,570px);max-height:78vh;overflow:auto;background:white;border-radius:22px 22px 0 0;box-shadow:0 -4px 32px #123a5040;padding:18px 18px 28px}.panel.show{display:block}.panelhead{display:flex;align-items:center;justify-content:space-between;gap:10px}.panelhead h2{font-size:20px;margin:0}.close{border:0;background:#edf3f6;border-radius:50%;width:34px;height:34px;font-size:19px}.muted{color:#667789;font-size:13px;line-height:1.6}.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.chip{border:1px solid #d7e3e9;border-radius:12px;background:white;padding:9px 12px;font-size:14px}.chip.active{background:var(--blue);border-color:var(--blue);color:white}.card{border:1px solid #e1e9ed;background:#f8fafb;border-radius:14px;padding:13px;margin:10px 0}.card h3{margin:0 0 7px;font-size:15px}.card p{margin:5px 0;font-size:14px;line-height:1.6}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.fields label{font-size:12px;font-weight:700}.fields select{display:block;width:100%;margin-top:6px;padding:11px 6px;border:1px solid #cddde5;border-radius:10px;background:white}.primary{background:var(--blue);color:white;border:0;border-radius:11px;padding:12px 15px;font-weight:700}.secondary{background:#e9f3f1;color:#075e58;border:0;border-radius:11px;padding:11px}.warn{background:#fff4dc;color:#785411;padding:10px;border-radius:10px;font-size:12px;line-height:1.6}.marker{border:2px solid white;border-radius:25px;padding:7px 10px;background:#174a72;color:white;white-space:nowrap;box-shadow:0 2px 9px #0004;font-size:12px;font-weight:800}.marker.end{background:#007c72}.maplibregl-ctrl-top-right{top:77px}.tiny{font-size:12px;color:#647583}details{margin-top:10px}summary{cursor:pointer;font-weight:700;padding:8px 0}@media(min-width:800px){.panel{left:18px;bottom:18px;transform:none;border-radius:20px;max-height:75vh}.float{bottom:20px}}
</style></head><body><div id="map" role="application" aria-label="경기대학교 수원캠퍼스 지도"></div><div class="top"><div class="brand"><b>♿ KGU 베리어프리맵 <span style="font-size:11px;color:#007c72">v3.3</span></b><small>경기대학교 수원캠퍼스 · 조사 기반 시범 서비스 · 건물 위치 추정</small></div><button id="sound" class="sound" aria-pressed="false">🔇 소리 끔</button></div><div class="float" id="float"><button id="openRoute">🧭 건물 이동</button></div>
<section class="panel" id="routePanel" aria-label="길찾기"><div class="panelhead"><h2>🧭 길찾기</h2><button class="close" data-close aria-label="닫기">×</button></div><p class="muted">현재 길찾기 대상은 진리관(1강의동)과 집현관(7강의동)입니다. 실제 보행로는 아직 등록되지 않았습니다.</p><div class="fields"><label>출발지<select id="from"><option value="start">진리관 · 1강의동</option><option value="end">집현관 · 7강의동</option></select></label><label>도착지<select id="to"><option value="end">집현관 · 7강의동</option><option value="start">진리관 · 1강의동</option></select></label></div><button class="primary" id="findRoute">경로 확인하기</button><div class="card" id="routeResult" hidden></div></section>
<section class="panel" id="buildingPanel" aria-label="건물 상세 정보"><div class="panelhead"><h2 id="buildingTitle">집현관 · 7강의동</h2><button class="close" data-close aria-label="닫기">×</button></div><p class="muted">시설 정보는 제공된 조사 내용 기준입니다. 지도 마커 위치는 사진을 바탕으로 추정했으며 현장 검증 전입니다.</p><div class="row" id="buildingTabs"><button class="chip active" data-building="7">집현관 · 7강의동</button><button class="chip" data-building="8">육영관 · 8강의동</button></div><div class="row" id="floorTabs"></div><div id="buildingContent"></div></section>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script><script>
const positions={"start": [127.033, 37.3005], "b2": [127.033825, 37.299522], "b4": [127.036439, 37.300722], "b5": [127.036804, 37.300043], "b6": [127.038332, 37.300904], "end": [127.038905, 37.301354], "b8": [127.039435, 37.300891], "library": [127.035466, 37.301211], "lecture": [127.037603, 37.301322], "convention": [127.035102, 37.302209], "research": [127.040329, 37.300813], "engineering": [127.040121, 37.300311]}; // 사용자 제공 지도 이미지 기반 추정 좌표, 현장 검증 전
const floors={7:{1:['반도체 연구실','카페','자판기','소화전','남자 화장실','프린터기','ATM'],2:['강의실','사회에너지 시스템공학과 스터디룸','소화전','여자 화장실'],3:['강의실','자판기','소화전','남자 화장실'],4:['실험실','강의실','독서실','자판기','소화전','여자 화장실'],5:['강의실','독서실','자판기','소화전','남자 화장실']},8:{1:['자판기','소화전','여자 화장실','남자 화장실','정수기','휴게 공간','프린터기','엘리베이터'],2:['소화전','여자 화장실','남자 화장실','정수기','휴게 공간','엘리베이터'],3:['자판기','소화전','여자 화장실','남자 화장실','정수기','엘리베이터'],4:['자판기','소화전','여자 화장실','남자 화장실','정수기','엘리베이터'],5:['자판기','소화전','여자 화장실','남자 화장실','정수기','엘리베이터']}};
// 8강의동 1~5층 화면은 임시 범위. '전 층' 조사 정보의 실제 층수는 확인 필요.
const icons={'자판기':'🥤','소화전':'🧯','여자 화장실':'🚺','남자 화장실':'🚹','정수기':'💧','휴게 공간':'🪑','프린터기':'🖨️','ATM':'🏧','엘리베이터':'🛗','독서실':'📚','카페':'☕'};
let audio=false,selectedBuilding=7,selectedFloor=0,map,points=[],drawing=false;const key='kgu-walking-path-draft-v1';const $=id=>document.getElementById(id);
function speak(s){if(!audio)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s);u.lang='ko-KR';u.rate=1; speechSynthesis.speak(u)}catch(e){}}function tick(){if(!audio)return;try{const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.frequency.value=660;g.gain.setValueAtTime(.035,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.07);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.075);setTimeout(()=>c.close(),150)}catch(e){}}
$('sound').onclick=()=>{audio=!audio;$('sound').textContent=audio?'🔊 소리 켬':'🔇 소리 끔';$('sound').setAttribute('aria-pressed',String(audio));if(!audio&&'speechSynthesis'in window)speechSynthesis.cancel();else speak('음성 안내가 켜졌습니다.')};function show(id){['routePanel','buildingPanel'].forEach(x=>$(x).classList.toggle('show',x===id));$('float').style.display=id?'none':'';tick()}document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>show(null));$('openRoute').onclick=()=>{show('routePanel');speak('길찾기. 출발지와 도착지를 선택하세요.')};
function building(n){$('buildingTabs').style.display='flex';selectedBuilding=n;selectedFloor=0;show('buildingPanel');renderBuilding();speak(n===7?'집현관 7강의동입니다.':'육영관 8강의동입니다.')}
function renderBuilding(){const n=selectedBuilding;$('buildingTitle').textContent=n===7?'🏫 집현관 · 7강의동':'🏫 육영관 · 8강의동';document.querySelectorAll('[data-building]').forEach(b=>b.classList.toggle('active',+b.dataset.building===n));$('floorTabs').innerHTML=[0,1,2,3,4,5].map(f=>`<button class="chip ${selectedFloor===f?'active':''}" data-floor="${f}">${f?f+'층':'전체'}</button>`).join('');document.querySelectorAll('[data-floor]').forEach(b=>b.onclick=()=>{selectedFloor=+b.dataset.floor;tick();renderBuilding();speak(selectedFloor?`${selectedFloor}층 시설 안내`:'전체 층 시설 안내')});let content='';if(selectedFloor){const items=floors[n][selectedFloor]||[];content=`<div class="card"><h3>${selectedFloor}층 시설</h3><p>${items.map(x=>(icons[x]||'📍')+' '+x).join(' · ')}</p></div>`}else{content=Object.entries(floors[n]).map(([f,items])=>`<div class="card"><h3>${f}층</h3><p>${items.map(x=>(icons[x]||'📍')+' '+x).join(' · ')}</p></div>`).join('')}content+=n===7?'<div class="card"><h3>♿ 접근성 안내</h3><p>정문·후문 접근 가능 (조사 제공 정보). 정문 진입 직후 경사로, 후문에서 제2공학관을 지나는 길에 경사로가 있습니다.</p><p>엘리베이터는 연결된 8강의동에 있으며 전 층 운행합니다. 7강의동 각 층과의 직접 연결 여부는 미확인입니다.</p><p>장애인 화장실: 없음 · 정수기: 없음</p></div>':'<div class="card"><h3>♿ 접근성 안내</h3><p>엘리베이터는 8강의동에 있으며 전 층 운행합니다. 7강의동과의 연결 통로 방향에서 접근할 수 있습니다.</p><p>장애인 화장실: 없음 · 정수기: 각 층</p><p class="tiny">8강의동의 실제 전체 층수는 확인이 필요합니다.</p></div>';$('buildingContent').innerHTML=content}
document.querySelectorAll('[data-building]').forEach(b=>b.onclick=()=>building(+b.dataset.building));
try{let saved=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(saved))points=saved.filter(x=>Array.isArray(x)&&x.length===2&&x.every(Number.isFinite))}catch(e){}
function updateRoute(){if(!map||!map.getSource('route'))return;map.getSource('route').setData({type:'FeatureCollection',features:points.length>1?[{type:'Feature',geometry:{type:'LineString',coordinates:points},properties:{}}]:[]});map.getSource('routePoints').setData({type:'FeatureCollection',features:points.map(p=>({type:'Feature',geometry:{type:'Point',coordinates:p},properties:{}}))});$('draftStatus').textContent=`경유점 ${points.length}개 · ${points.length>1?'미검증 수동 입력 경로':'경로 미등록'}`}
$('findRoute').onclick=()=>{tick();const same=$('from').value===$('to').value;const result=$('routeResult');result.hidden=false;if(same){result.innerHTML='<h3>출발지와 도착지가 같아요</h3><p>서로 다른 건물을 선택해 주세요.</p>';return}if(points.length<2){result.innerHTML='<h3>🚶 실제 보행로 데이터가 아직 없어요</h3><p>현재는 직선으로 연결하지 않습니다. 실제 보행로 좌표를 확인한 후 길찾기를 제공할 예정입니다.</p><p class="tiny">1강의동 → 7강의동 조사 경로에 계단이 없다는 정보만 확보했습니다. 휠체어 통행 가능 여부는 미검증입니다.</p>'}else{result.innerHTML='<h3>🟢 등록된 보행 경로 초안</h3><p>지도에 수동 조사 경로를 표시했습니다. 보행로 및 접근성 검증 전이므로 안전한 휠체어 경로로 보장하지 않습니다.</p>';map.fitBounds(points.reduce((b,p)=>b.extend(p),new maplibregl.LngLatBounds(points[0],points[0])),{padding:85})}speak('길찾기 결과를 확인하세요. 경로는 접근성 검증이 필요합니다.')};
try{map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/liberty',center:[127.0347,37.2998],zoom:16.4});map.addControl(new maplibregl.NavigationControl(),'top-right');const buildingMarkers=[["start", "진리관 · 1강의동"], ["b2", "성신관 · 2강의동"], ["b4", "예지관 · 4강의동"], ["b5", "덕문관 · 5강의동"], ["b6", "광교관 · 6강의동"], ["end", "집현관 · 7강의동"], ["b8", "육영관 · 8강의동"], ["library", "중앙도서관"], ["lecture", "종합강의동"], ["convention", "컨벤션센터"], ["research", "리서치센터"], ["engineering", "제2공학관"]];for(const [k,label] of buildingMarkers){const el=document.createElement("button");el.className="marker "+(k==="end"||k==="b8"?"end":"");el.textContent=label;el.title=label+" (사진 기준 추정 위치)";el.onclick=()=>{if(k==="end")building(7);else if(k==="b8")building(8);else if(k==="start")show("routePanel");else{show("buildingPanel");$("buildingTitle").textContent="🏫 "+label;$("buildingTabs").style.display="none";$("floorTabs").innerHTML="";$("buildingContent").innerHTML="<div class=card><h3>시설 정보 조사 예정</h3><p>현재 건물 위치만 표시하고 있어요. 층별 편의시설은 아직 조사되지 않았습니다.</p></div>";speak(label+". 상세 시설 정보는 조사 예정입니다.")}};new maplibregl.Marker({element:el}).setLngLat(positions[k]).addTo(map)}map.on('load',()=>{map.addSource('route',{type:'geojson',data:{type:'FeatureCollection',features:[]}});map.addSource('routePoints',{type:'geojson',data:{type:'FeatureCollection',features:[]}});map.addLayer({id:'route-line',type:'line',source:'route',paint:{'line-color':'#008c79','line-width':6,'line-dasharray':[2,1]}});map.addLayer({id:'route-points',type:'circle',source:'routePoints',paint:{'circle-color':'#008c79','circle-radius':5,'circle-stroke-color':'#fff','circle-stroke-width':2}});updateRoute();map.fitBounds(buildingMarkers.reduce((b,[k])=>b.extend(positions[k]),new maplibregl.LngLatBounds(positions.start,positions.start)),{padding:75})});}catch(e){$('map').innerHTML='<p style="padding:130px 20px">지도를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.</p>'}
</script></body></html>
